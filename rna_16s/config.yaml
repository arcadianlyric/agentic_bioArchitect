samples:
    ########### start fill ###
    # list of lanes to use. format as fastq/V350094071_L04, leave blank if start from split.read.fq.gz,
    # in the format of *_1.fq.gz
    lanes: [V350132145]
    name: "V350132145"
    ########### end fill ###

    # specifies expected location of split reads [data/split_read.1.fq.gz, data/split_read.2.fq.gz] for PE
    # SE read treated as read2
    fastq: [data/split_read.1.fq.gz, data/split_read.2.fq.gz]
    # path for reads.fq.gz before splitting, leave blank if start from split.read.fq.gz, 
    fq_path: "../fastq"
    # sample or id to use for generating targets
    id: "data"
    # Chromosomes to evaluate for fragment length and phasing
    # Leave empty for cDNA/mRNA ref or if there are too many chromosomes to specify or you're unsure
    # This will force snakemake to evaluate all chromosomes
    chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY, ERCC-00130, ERCC-00096, ERCC-00116, ERCC-00025]

modules:
    ### start fill ### for standard analysis set True: BCsplit,  mapping, LFR, eval_metrics
    # set false if no BC in seq, 
    BCsplit: True
    # set mapping=False to only run BC split
    mapping: True
    # Should snakemake do stlfr specific analyses, false if the library isn't of linked reads
    LFR: False
    # run eval metrics, or just mapping
    eval_metrics: True
    # Should a VCF be generated
    variant_calling: False
    # Should longhap and hapcut be run and evaluated
    phasing: False
    # Should VCF results be benchmarked against the files specified under benchmark
    benchmarking: False
    # all other set false if using 'BCgDNA' (for stLFR bc followed by gDNA analysis)
    BCgDNA: False
    # run de novo assembly on each fragment defined by BC
    frag_de_novo: False
    # eoxns to frag.fasta
    exon2fasta: False
    # consensus_fasta
    consensus_fasta: False
    # rna 16s, 'frag_denovo',  'frag_denovo', 'align_ref'
    rna_16s: 'align_ref'
    ### end fill ###

    # You'll probably never run this
    mate_pair_analysis: False
    # or this
    read_overlap_analysis: False
    # or this
    duplicate_plot: False
    # output files necessary for UMI analysis
    umi_analysis: False

params:
    ########### start fill ###
    correct_rc: True
    # map mrna library to genome, default 'star' (or 'hista2')
    mrna_mapper: 'star'
    # 'human' or 'other'
    library_species: 'human'
    # for phasing accuracy, if not hg001, 002, 005, keep empty
    ref_id: ''
    ### library type 'gdna' (map with BWA) or 'mrna' (map with STAR) 
    library_type: 'mrna'
    # sequence_type, pe or se, lower case
    sequence_type: 'pe'
    # choose from 'random_bc' for cLFR and 'standard' for stLFR; 'random_bc_umi_rc' for r2 UMI
    # 'standard_ac_swap', 'standard_gc_swap' for base swap, 'pcrfree' 
    #'combined' for +additonal bc OR stlfr 10_10_10 +clfr AAAAAAAAAA, 'BCgDNA'
    bc_condition: 'pcrfree'
    total_r2_len: 185
    total_r1_len : 0
    # bc start position on R2
    bc_start: 0
    ### stLFR BC length, example 42
    sbc_len : 0
    ### cLFR randomBC length for bx tag, example 15
    cbc_len: 0
    # Read length without barcode (for SE: r1_len=0)
    # gDNA start position on R2, index start from 1, index number not a continuation of R1, for SE data, reads with BC treated as R2
    gdna_start: 1
    # gdna length on R2
    read_len: 150
    # gdna start position on R1
    gdna_start_r1: 1
    # gdna length on R1
    read_len_r1: 150
    ### additional_bc_len (transposon BC, positional BC), add to readID, default 0
    additional_bc_start: 0
    additional_bc_len: 0
    additional_bc_len_r1: 0
    ### BCgDNA analysis, default 0
    adapter_len: 0
    ########### end fill ###

    ### choose from /home/ycai/hm/test (test) and /pipeline (prod)
    splitNfq: 32
    is_fulllane_unfiltered: True
    bwa_mem: 'mem'
    gc_swap: False
    platform: "BGI-seq"
    barcode: "/barcode.list"
    barcode_RC: "/barcode_RC.list"
    enforced_bc_list: ""

