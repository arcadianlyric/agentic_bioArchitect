calc_frag:
    ########### start fill ###
    # for redefine_frag, metadata stlfr=4, clfr=50
    minreads: 'default'
    # mapq default stlfr=30, clfr=0
    mapping_quality: 'default'
    # minimum fragment length for fragment calculations
    min_frag: 500
    # exon to fasta, filter >=100 reads per BC
    minreads_fasta: 100
    # choose from 'random_bc' for cLFR and 'standard' for stLFR; 'random_bc_umi_rc' for r2 UMI
    #'combined' for +additonal bc OR stlfr 10_10_10 +clfr AAAAAAAAAA, 'BCgDNA'
    calc_bc_condition: ''
    ########### end fill ###

    # tolerance N in BC
    n_tolerance: 2
    # slice chromosome region for faster turnaround
    # region: "chr19"
    # split distances to use for long fragment calculations [50000, 300000]
    split_dist: [50000]
    # true=check dup pos, but N_Reads always dedup; include duplicates, in fragment calculations. If two reads share the same barcode and mapping position they're treated as duplicates anyway.
    include_dups: True
    # object_store_memory=200*1024*1024*1024, memory=100*1024*1024*1024 [(200,1024), (100, 1024)]
    # set ray mem, no space between numbers, need to be 200G
    ray_mem: "200,1024,100,1024"
    # ray_mem: "9000,1,9000,1"
    writeouttsvs: True
    # apply_quality_filter: True
    ### coverage bias
    num_bin_in_frag: 10
    # coverage bias plot, set y-axis hight, default 50
    ylim: 50

longhap:
    # Longhap parameters, window size determines bin size for calculations
    win_size: 10000000
    # Max expected length of LFR fragment
    max_lfr_len: 300000
    min_barcode: 1
    min_link: 1

frag_de_novo:
    run_parallel: False
    reads_per_BC: 50
    margin: 5
    denovo_assembler: "/home/ycai/tools/SPAdes-3.14.0-Linux/bin/spades.py"
    spades_phred_offset: 55
    quast_dir: "/home/eanderson/quast/quast.py"
    quast_min_contig: 100
    # default true
    quast_space_efficient: True
    minimap: "/home/eanderson/minimap2-2.16_x64-linux/minimap2"
    # denovo_type: mrna=correlct_rc or 16s=correct_rc
    denovo_type: 'correct_rc'
    # if to run on sigle node: how many lines to process for denovo, set to a dummy number 1000000000 to run all
    # if to run on multiple node: = chunk_length  
    end_idx: 485000000
    start_idx: 1
    flank_end: 30
    adapter_seq: "CTCAGCAGAGGG"
    min_ctg_len: 400
    num_processes: 20

umi:
    umi_pos_strand_batch: "P150007331_L02"    

